<text x="40" y="718" class="sub">Break-even is ~30% acceptance for the n-gram proposer and ~60% at K=4 for the draft path, which costs a forward pass per proposal. Below that line a round returns fewer tokens than it cost.</text>
<rect x="40" y="735" width="13" height="4" fill="#0b8457"/>
<text x="59" y="741" class="leg">n-gram, repetitive prompts</text>
<rect x="239" y="735" width="13" height="4" fill="#7cc4a5"/>
<text x="258" y="741" class="leg">n-gram, open-ended prompts</text>
<rect x="438" y="735" width="13" height="4" fill="#b3541e"/>
<text x="457" y="741" class="leg">draft model @ ~100% acceptance</text>
<rect x="663" y="735" width="13" height="4" fill="#d9a06b"/>
<text x="682" y="741" class="leg">draft model @ 0% acceptance</text>
