<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 770" width="940" height="770" font-family="DejaVu Sans, Segoe UI, sans-serif">
<style>text{fill:#1b1b1b} .ttl{font-size:14.5px;font-weight:600}.sub{font-size:12px;fill:#555} .tick{font-size:11px;fill:#555}.axis{font-size:12px;fill:#333} .note{font-size:10.5px}.leg{font-size:12px} .ar{text-anchor:end} .ae{text-anchor:end}.mid{text-anchor:middle} .box{fill:none;stroke:#cccccc;stroke-width:1}.grid{stroke:#eeeeee;stroke-width:1}.line{fill:none;stroke-width:2.4;stroke-linejoin:round}.base{stroke-width:1.6;stroke-dasharray:6 4}</style>
