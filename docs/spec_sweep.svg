<text x="40" y="38" style="font-size:19px;font-weight:700">Speculative decoding in mini-vllm: throughput vs K</text>
<text x="40" y="60" class="sub">Qwen3-0.6B on an RTX 3050 Laptop (4 GB), bf16, CUDA graphs on, greedy decoding, 2 concurrent requests.</text>
<text x="40" y="78" class="sub">Points at a verify width of 14 or below emitted byte-identical text; the sweep checks output hashes. Wider rounds write different KV than plain decode and cannot.</text>
<text x="96" y="94" class="ttl">Throughput. Dashed lines are plain decode - the bar each proposer has to clear.</text>
